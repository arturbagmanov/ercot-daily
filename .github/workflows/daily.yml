name: daily recap

on:
  schedule:
    # Five attempts, 13:17-21:17 UTC (08:17-16:17 Central in summer).
    # GitHub's scheduler is best-effort: in the first two days it skipped the
    # 13:30 slot twice and ran the 18:30 one twenty minutes late. Runs are
    # idempotent, so once a day is in, later attempts are a 25-second no-op;
    # the redundancy costs nothing and the odd minute avoids the congested
    # top and bottom of the hour.
    - cron: "17 13,15,17,19,21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Operating day to (re)build, YYYY-MM-DD. Blank = yesterday."
        required: false

permissions:
  contents: write

concurrency: daily

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Fetch and render
        env:
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
          # Via the environment, not interpolated into the script: a workflow
          # input spliced into `run:` is a shell injection waiting to happen.
          RUN_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python -m ercot_daily.cli run --date "$RUN_DATE"
          else
            python -m ercot_daily.cli run
          fi

      - name: Commit as github-actions[bot]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          day=$(tail -n 1 data/daily.csv | cut -d, -f1)
          git commit -m "Recap for operating day ${day}"
          git push
