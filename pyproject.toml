[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ercot-daily"
version = "0.1.0"
description = "Daily ERCOT market recap: yesterday's net load and HB_HOUSTON day-ahead vs real-time prices."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "matplotlib>=3.8",
    "requests>=2.31",
    "tzdata>=2024.1",  # Windows ships without the IANA time-zone database
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
